services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: eleja
      POSTGRES_USER: eleja
      POSTGRES_PASSWORD: eleja
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    volumes:
      - eleja-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U eleja -d eleja']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

volumes:
  eleja-postgres-data:
